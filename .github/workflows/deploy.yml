name: CI/CD Pipeline - fengshui-shifu-ui

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test Expo Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npx expo export -p web
