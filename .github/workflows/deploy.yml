name: CI/CD Pipeline - fengshui-shifu-ui

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy to AWS S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://api.fengshui-shifu.com/api/v1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Web Bundle to AWS S3
        run: aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET || 'fengshui-shifu-ui-prod' }} --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} --paths "/*"
