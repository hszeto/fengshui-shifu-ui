services:
  - type: web
    name: fengshui-shifu-ui
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://api.fengshui-shifu.com/api/v1
      - key: NODE_VERSION
        value: 18
    routes:
      - type: rewrite
        source: /*
        destination: /index.html